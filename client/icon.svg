          font-size="160" font-weight="900"
          fill="url(#text)"
          stroke="#1a0a14" stroke-width="6"
          paint-order="stroke fill">UNO</text>
  </g>
  <g opacity="0.9">
    <circle cx="80" cy="80" r="6" fill="#FFD700"/>
    <circle cx="432" cy="100" r="5" fill="#FFB87A"/>
    <circle cx="100" cy="430" r="5" fill="#FFB87A"/>
    <circle cx="430" cy="420" r="6" fill="#FFD700"/>
  </g>
