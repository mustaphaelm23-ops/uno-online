<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3F0E1A"/>
      <stop offset="60%" stop-color="#1A0606"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="oval" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF5577"/>
      <stop offset="55%" stop-color="#E8324A"/>
      <stop offset="100%" stop-color="#7A0F1F"/>
    </radialGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE96B"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256 256) rotate(-12)">
    <ellipse cx="0" cy="0" rx="200" ry="120" fill="url(#oval)" stroke="#FFD700" stroke-width="6" opacity="0.95"/>
    <text x="0" y="38" text-anchor="middle"
